#
# A deck host's PipeWire server: the same rate and smallest block as a3-core's
# 10-a3-rate.conf on the Core. The deck-host role copies this file into
# ~/.config/pipewire/pipewire.conf.d/ and removes it on leave; only the role
# knows the machine is a deck host, so the package never puts it there itself.
#
# 44.1 kHz end to end: the AES67 streams carry 44.1 kHz, and a graph at 48 kHz
# would resample every packet. Never below 128 samples: the deck sender's short
# packets would otherwise pull the graph, StemDeck and Motion included, down to
# 32 samples. Change it together with a3-core's file.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    default.clock.quantum       = 128
    default.clock.min-quantum   = 128
}
