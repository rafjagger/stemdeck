# Energy Efficient Ethernet off on every wired port (needs systemd >= 262;
# older versions log the unknown section and ignore it; the udev rule
# 80-stemdeck-eee-off.rules covers those).
# Why: with EEE active the igb audio port dropped its link every 1-2 minutes,
# each drop a ~3 s hole in the AES67 stream (2026-10-17).
[EnergyEfficientEthernet]
Enable=false
